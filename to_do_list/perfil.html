<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #f2f2f2;
        }

        main {
            padding: 10px;
        }

        .oculto {
            display: none;
        }

        #modalconfirmacao {
            position: fixed;
            inset: 0;
            z-index: 1000;

            background-color: rgb(0 0 0 / 50%);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #modalconfirmacao.oculto {
            display: none;
        }

        .conteudomodal {
            width: 100%;
            max-width: 400px;
            padding: 24px;

            background-color: white;

            border-radius: 12px;
        }

        .conteudomodal h2 {
            margin-top: 0px;
        }

        #informacaotarefa {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            border-radius: 12px;
            padding: 10px;
            background-color: rgba(128, 128, 128, 0.103);
            margin-bottom: 8px;
        }

        #informacaotarefa .informacao, .aviso {
            margin-top: 0px;
            margin-bottom: 0px;
        }

        #informacaotarefa .aviso {
            margin-top: px;
        }

        .botoesmodal {
            display: flex;
            justify-content: end;
        }

        #perfil {
            border: 1px solid black;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        #perfil .conteudo {
            display: flex;
            align-items: center;
            border-radius: 6px;
            padding: 8px 10px;
        }

        #msglogout {
            font-size: 0.8em;
            text-align: center;
            margin: 0px;
        }

        #perfil i {
            margin-right: 8px;
            font-size: 2.5em;
        }

        #elementos {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        #elementosperfil {
            display: flex;
            flex-direction: column;
            width: 90%;
        }

        #elementosperfil .msg {
            font-size: 0.8em;
        }

        #logout {
            border: 0px;
        }

        #logout i {
            margin: 0px;
            font-size: 1.5em;
        }

        #areacriacao {
            text-align: start;
            border: 1px solid black;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        #areacriacao i, #containerfiltros i {
            margin-left: 2px;
        }

        .campo{
            display: flex;
            flex-direction: column;
            padding: 2px;
            width: 100%;
            height: 20%;
        }

        #mensagenstitulo, #mensagensdescricao {
            display: flex;
            justify-content: space-between;
        }

        #mensagenstitulo p, #mensagensdescricao p{
            font-size: 0.8em;
            margin: 0px;
        }
        
        #titulo {
            padding: 0px;
            width: 100%;
            border-radius: 5px;
        }

        #descricao {
            width: 100%;
            height: 80px;
            border-radius: 5px;
        }

        #mensagenstitulo .div-contador, #mensagensdescricao .div-contador {
            display: flex;
            justify-content: end;
        }

        #errotitulo, #errodescricao {
            text-align: start;
            font-size: 0.8em;
            margin: 0px 0px 0px 3px;
            height: 20%;
        }

        #adicionar {
            margin-left: 2px;
            width: 100px;
            border-radius: 5px;
        }

        #filtros {
            border: 1px solid black;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
        }

        #containerfiltros div {
            display: flex;
            margin: 0px;
        }

        #containerfiltros {
            margin-bottom: 8px;
            border: 1px solid black;
            border-radius: 6px;
            padding: 2px;
        }

        #containerfiltros div * {
            margin: 0px;
        }

        #colunaum, #colunadois {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 50%;
            padding: 5px; 
        }

        #colunaum p, #colunadois p {
            font-size: 0.9em;
        }

        #containerfiltros select {
            width: 100%;
            margin-top: 5px;
        }

        #containerfiltros #status, #prioridade, #datacriacao, #dataconclusao, #ordenarpor, #ordem {
            display: flex;
            flex-direction: column;
        }

        #divreset {
            display: flex;
            justify-content: end;
        }

        #resetarfiltros {
            border-radius: 4px;
        }

        #filtros .elementosiniciais {
            display: flex;
        }

        #filtros .elementosiniciais .elementovisualfunil {
            display: flex;
            align-items: center;
            margin-left: 3px;
            margin-right: 4px;
        }

        #filtros .elementosiniciais .elementos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 5px 0px 5px 5px;
        }

        #filtros div {
            display: flex;
        }

        #filtros .botaofiltro {
            font-size: 0.75em;
            padding: 4px;
            border-radius: 8px;
            width: 80px;
        }

        #containerfiltros.oculto, #divreset.oculto {
            display: none;
        }

        #menu {
            display: flex;
            justify-content: end;
            margin: 0px;
        }

        #menu .menu {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 110px;
            border: 1px solid black;
            border-radius: 8px;
        }

        #menu .menu i {
            margin: 0px;
            border: 0px;
        }

        #menu i {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            margin-left: 5px;
        }

        #menu .menu .divopcao {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        #menu .menu .divopcao  div {
            display: flex;
        }

        #menu .menu .divopcao .opcaoexcluir {
            border: 0px;
            height: 25px;
        }

        #divlista {
            border: 1px solid black;
            border-radius: 6px;
            padding: 10px;
        }

        #lista {
            list-style: none;
            padding: 0px;
            margin-top: 5px;
        }

        #lista li {
            display: flex;
            margin-bottom: 6px;
            border: 1px solid black;
            border-radius: 6px;
        }

        #lista li .containerintermediario {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            width: 100%;
        }

        #lista li .containerintermediario .editar-propriedade {
            border: 0px;
        }

        #lista li .containerintermediario .divopcao div {
            width: 100%;
        }

        #lista li .container {
            padding: 8px;
        }

        #lista li .container .excluir {
            width: 70px;
            border-radius: 6px;
        }

        #lista li .container .propriedade {
            display: flex;
            gap: 12px;
            margin-bottom: 5px;
        }

        #lista li .container .divtitulo h3{
            margin: 0px;
            height: 20px;
        }

        #lista li .container .divdescricao p.conteudo {
            max-width: 300px;
            overflow-wrap: anywhere;
            white-space: normal;
            margin: 0px;
        }

        #lista li .container .editar-propriedade, .salvar {
            font-size: 0.7em;
            width: 70px;
            height: 20px;
            border-radius: 6px;

        }

        #lista li .container .propriedade .input-descricao {
            width: 180px;
            height: 80px;
        }

        .div-checkbox {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 8%;
            border-right: 1px solid black;
            padding: 8px;
        }

        .checkbox {
            transform: scale(1.5);
        }

        .div-parteum, .div-partedois, .div-partetres {
            margin-bottom: 8px;
        }

        .div-partedois {
            display: flex;
            gap: 10px;
        }

        .div-partedois .conteudoprioridade{
            font-size: 0.7em;
            padding: 5px;
            border-radius: 12px;
        }

        .div-partedois .conteudoprioridade option {
            border-radius: 12px;
        }

        .div-partedois .div-status {
            font-size: 0.7em;
            border: 1px solid black;
            background-color: white;
            padding: 5px;
            border-radius: 12px;
        }

        .div-partetres {
            font-size: 0.75em;
        }

    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <main>
        <div id="modalconfirmacao" class="oculto">
            <div class="conteudomodal">
                <h2><i class="fa-solid fa-triangle-exclamation"></i>  Excluir tarefa?</h2>

                <p id="mensagemconfirmacao">Tem que certeza que deseja excluir essa tarefa?</p>

                <div id="informacaotarefa">
                    <h3 class="informacao"></h3>
                    <p class="aviso">Está ação não pode ser desfeita.</p>
                </div>

                <div class="botoesmodal">
                    <button class="cancelar">Cancelar</button>
                    <button class="confirmar">Excluir</button>
                </div>
            </div>
        </div>
        <div id="perfil">
            <div class="conteudo">
                <span><i class="fa-solid fa-circle-user"></i></span>
                <div id="elementos">
                    <div id="elementosperfil">
                        <span class="perfiltexto"></span>
                        <span class="msg">Seja bem vindo!</span>
                    </div>
                    <button id="logout"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                </div>
            </div>
            <div class="div-mensagem-erro">
                <p id="msglogout" class="oculto"></p>
            </div>
        </div>
        <div id="areacriacao">
            <i class="fa-solid fa-circle-plus"></i>
            <span>Nova tarefa</span>
            <div class="campo titulo">
                <input type="text" id="titulo" maxlength="20" placeholder="Título da tarefa">
                <div id="mensagenstitulo">
                    <div class="div-erro">
                        <p id="errotitulo" class="oculto"></p>
                    </div>
                    <div class="div-contador">
                        <p id="contadortitulo">0/20</p>
                    </div>
                </div>
            </div>
            <div class="campo descricao">
                <textarea id="descricao" maxlength="200" placeholder="Descrição (Opicional)"></textarea>
                <div id="mensagensdescricao">
                    <div class="div-erro">
                        <p id="errodescricao" class="oculto"></p>
                    </div>
                    <div class="div-contador">
                        <p id="contadordescricao">0/200</p>
                    </div>
                </div>
            </div>
            <button id="adicionar">Adicionar</button>
        </div>
            <div id="filtros">
                <div class="elementosiniciais">
                    <span class="elementovisualfunil"><i class="fa-solid fa-filter"></i></span>
                    <div class="elementos">
                        <span>Filtros</span>
                        <div><button id="mostrarfiltros" class="botaofiltro"><i class="fa-solid fa-arrow-down-wide-short"></i> Filtros</button></div>
                    </div>
                </div>
                <div id="containerfiltros" class="oculto">
                    <div id="colunaum">
                        <div id="status">
                            <p>Status:</p>
                            <select id="selectstatusfiltros">
                                <option value="todas">Todas</option>
                                <option value="concluidas">Concluídas</option>
                                <option value="pendentes">Pendentes</option>
                            </select>
                        </div>
                        <div id="prioridade">
                            <p>Prioridade:</p>
                            <select id="selectprioridadefiltros">
                                <option value="todas">Todas</option>
                                <option value="alta">Alta</option>
                                <option value="media">Média</option>
                                <option value="baixa">Baixa</option>
                            </select>
                        </div>
                        <div id="datacriacao">
                            <p>Data de Criação:</p>
                            <select id="selectcriacaofiltros">
                                <option value="todas">Todas</option>
                                <option value="setedias">Últimos 7 dias</option>
                                <option value="trintadias">Últimos 30 dias</option>
                                <option value="noventadias">Últimos 90 dias</option>
                            </select>
                        </div>
                    </div>
                    <div id="colunadois">
                        <div id="dataconclusao">
                            <p>Data de Conclusão:</p>
                            <select id="selectconclusaofiltros">
                                <option value="todas">Todas</option>
                                <option value="setedias">Últimos 7 dias</option>
                                <option value="trintadias">Últimos 30 dias</option>
                                <option value="noventadias">Últimos 90 dias</option>
                            </select>
                        </div>
                        <div id="ordenarpor">
                            <p>Ordenar por:</p>
                            <select id="selectordenarporfiltros">
                                <option value="nenhum">Nenhum</option>
                                <option value="status" selected>Status</option>
                                <option value="prioridade">Prioridade</option>
                                <option value="criacao">Data de criação</option>
                                <option value="conclusao">Data de conclusão</option>
                            </select>
                        </div>
                        <div id="ordem">
                            <p>Ordem:</p>
                            <select id="selectordemfiltros">
                                <option class="opcum" value="pendentes">Pendentes</option>
                                <option class="opcdois" value="concluidas">Concluídas</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div id="divreset" class="oculto"><button id="resetarfiltros"><i class="fa-solid fa-arrows-rotate"></i> Resetar</button></div>
            </div>
        <div id="mostrarestadotarefa"></div>
        <div id="divlista">
            <i class="fa-solid fa-circle-plus"></i>
            <span>Lista de tarefas</span>
            <ul id="lista"></ul>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/eventos/tarefasEventos.js"></script>
    <script type="module" src="js/eventos/authObserver.js"></script>
</body>
</html>
