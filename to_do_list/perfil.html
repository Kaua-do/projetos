<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #f2f2f2;
        }


    </style>
</head>
<body>
    <main>
        <div id="perfil">
            <span class="perfiltexto"></span>
            <button id="logout">Sair</button>
        </div>
        <div id="areacriacao">
            <div class="campo">
                <input type="text" id="titulo" placeholder="Título">
                <p id="errotitulo" class="oculto"></p>
            </div>
            <div class="campo">
                <input type="textarea" id="descricao" placeholder="Descrição">
                <p id="errodescricao" class="oculto"></p>
            </div>
            <button id="adicionar">Adicionar</button>
            <p id="msglogout"></p>
        </div>
            <p>Filtros</p>
            <div id="containerfiltros">
                <p>Status:</p>
                <select id="selectstatusfiltros">
                    <option value="todas">Todas</option>
                    <option value="concluidas">Concluídas</option>
                    <option value="pendentes">Pendentes</option>
                </select>

                <p>Prioridade:</p>
                <select id="selectprioridadefiltros">
                    <option value="todas">Todas</option>
                    <option value="alta">Alta</option>
                    <option value="media">Média</option>
                    <option value="baixa">Baixa</option>
                </select>

                <p>Data de criação:</p>
                <select id="selectcriacaofiltros">
                    <option value="todas">Todas</option>
                    <option value="setedias">Últimos 7 dias</option>
                    <option value="trintadias">Últimos 30 dias</option>
                    <option value="noventadias">Últimos 90 dias</option>
                </select>

                <p>Data de conclusão:</p>
                <select id="selectconclusaofiltros">
                    <option value="todas">Todas</option>
                    <option value="setedias">Últimos 7 dias</option>
                    <option value="trintadias">Últimos 30 dias</option>
                    <option value="noventadias">Últimos 90 dias</option>
                </select>

                <p>Ordenar por:</p>
                <select id="selectordenarporfiltros">
                    <option value="nenhum">Nenhum</option>
                    <option value="status" selected>Status</option>
                    <option value="prioridade">Prioridade</option>
                    <option value="criacao">Data de criação</option>
                    <option value="conclusao">Data de conclusão</option>
                </select>

                <p>Ordem:</p>
                <select id="selectordemfiltros">
                    <option class="opcum" value="pendentes">Pendentes</option>
                    <option class="opcdois" value="concluidas">Concluídas</option>
                </select>
                <button id="resetarfiltros">Resetar</button>
            </div>
        <div id="mostrarestadotarefa"></div>
        <ul id="lista"></ul>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/eventos/tarefasEventos.js"></script>
    <script type="module" src="js/eventos/authObserver.js"></script>
</body>
</html>
